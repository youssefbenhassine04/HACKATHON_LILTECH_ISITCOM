<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M100 12 C145 12 182 25 182 50 C182 125 142 165 100 188 C58 165 18 125 18 50 C18 25 55 12 100 12 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- Inner Border -->
  <path d="M100 24 C136 24 168 35 168 56 C168 116 134 152 100 172 C66 152 32 116 32 56 C32 35 64 24 100 24 Z" fill="none" stroke="#d4af37" stroke-width="1.8" opacity="0.6" stroke-dasharray="3,2" />

  <!-- Tunisian Red Roundel with White Crescent & Star -->
  <circle cx="100" cy="80" r="32" fill="#d62828" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="100" cy="80" r="23" fill="#ffffff" />
  <!-- Red Crescent -->
  <circle cx="101" cy="80" r="15" fill="#d62828" />
  <circle cx="104.5" cy="80" r="12" fill="#ffffff" />
  <!-- Red Star -->
  <polygon points="98,75 100.5,81 106.5,81.5 101.5,85 103.5,91 98.5,87 93.5,91 95.5,85 90.5,81.5 96.5,81" fill="#d62828" />

  <!-- Scales of Justice / Laurel Branch -->
  <path d="M70 122 L130 122" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M100 115 L100 135" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M85 135 L115 135" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Text -->
  <text x="100" y="156" font-family="Cairo, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">الشرطة البلدية</text>
  <text x="100" y="44" font-family="Cairo, sans-serif" font-size="9" font-weight="600" fill="#d4af37" text-anchor="middle">الجمهورية التونسية</text>
</svg>
