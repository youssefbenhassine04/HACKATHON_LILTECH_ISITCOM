name: police-municipale

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-police_municipale}
      # Arabic text requires UTF-8; matches the embedded local cluster.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      # PostgreSQL 18+ stores data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-police_municipale}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Uncomment to reach the database from the host (psql, pgAdmin, …).
    # ports:
    #   - '5432:5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-police_municipale}
      # Browser origin the SPA is opened from; must match the address you use.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      # Plain HTTP locally: Secure cookies would be dropped by the browser.
      # Set to true when serving over HTTPS (directly or via a TLS proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      ALLOW_DB_RECONNECT: ${ALLOW_DB_RECONNECT:-false}
      ALLOW_DEMO_RESET: ${ALLOW_DEMO_RESET:-false}
    ports:
      - '${APP_PORT:-3001}:3001'

volumes:
  pgdata:
